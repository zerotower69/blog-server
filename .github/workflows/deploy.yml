name: Deploy to CentOS Server

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use a secret in a step
        run: echo "The secret value is ${{ secrets.MY_SEVER_NAME }}"
        env:
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
      - name: Use a secret in a step
        run: echo "The secret value is ${{ secrets.MY_SEVER_PASSWORD }}"
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      
      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'
      
      - name: 下载依赖、打包项目
        run: |
          npm install -g pnpm   # 全局安装 pnpm
          pnpm install --registry=https://registry.npmmirror.com/         # 安装依赖
          pnpm run build


      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: './dist,package.json'
          target: '/www/wwwroot/blog/server'

      - name: SSH to server and restart application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            servername=${{ secrets.SERVER_NAME }}
            echo "server name is $servername"
            cd /www/wwwroot/blog/server
            npm install --production --registry=https://registry.npmmirror.com/ 
            npm run build
            pm2 restart

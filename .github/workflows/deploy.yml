name: Deploy to CentOS Server

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'
      
      - name: 下载依赖、打包项目
        run: |
          npm install      # 安装依赖
          npm run build


      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: './dist,package.json'
          target: '/www/wwwroot/blog/server'

      - name: SSH to server and restart application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 确保 npm 和 pm2 在 PATH 中
            export PATH=$PATH:/usr/local/bin
            cd /www/wwwroot/blog/server
            npm install --omit=dev
            npm install pm2 -g --registry=https://registry.npmmirror.com/
            pm2 restart
